name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.tex"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.tex"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:
  schedule:
    # Daily rebuild (03:00 KST) so newly created public repos show up on /software/.
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update Google Scholar citations 📈
        # Refreshes _data/citations.yml for the Scholar badges on each build (the daily
        # schedule included). Scholar sometimes blocks CI runners; the build then uses the
        # committed counts unchanged. When blocked, scholarly retries for ~8 minutes, so cap it.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          pip install scholarly pyyaml "bibtexparser<2"  # scholarly still imports the 1.x API
          python3 bin/update_scholar_citations.py
      - name: List public GitHub repos 📚
        # /software/ shows every public repo of the site owner, most recently pushed first.
        # Regenerated on each build, so the committed _data/repositories.yml is only a fallback.
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "github_users:"
            echo "  - $OWNER"
            echo ""
            echo "repo_description_lines_max: 2"
            echo ""
            echo "github_repos:"
            gh repo list "$OWNER" --visibility public --limit 200 --json nameWithOwner,pushedAt \
              --jq 'sort_by(.pushedAt) | reverse | .[] | "  - " + .nameWithOwner'
          } > _data/repositories.yml
          cat _data/repositories.yml
      - name: Build CV and resume PDFs 📄
        # cv/cv.tex (full CV) and cv/resume.tex read the same _bibliography/*.bib files as the
        # site, so every push republishes PDFs that match the publications page.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra biber latexmk
          cd cv
          latexmk -pdf -interaction=nonstopmode -halt-on-error resume.tex cv.tex
          mkdir -p ../assets/pdf
          cp cv.pdf resume.pdf ../assets/pdf/
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
